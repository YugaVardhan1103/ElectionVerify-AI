<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElectionVerify AI — AI-Assisted Election Information Verification</title>
    <!-- Prevent initial theme flash (FOUC) before React mounts -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("themePreference");
          if (saved) {
            saved =
              saved.trim().charAt(0).toUpperCase() +
              saved.trim().slice(1).toLowerCase();
          }
          if (saved !== "Light" && saved !== "Dark" && saved !== "System") {
            saved = "System";
          }
          var isDark =
            saved === "Dark" ||
            (saved === "System" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Google Identity Services & Facebook JavaScript SDK for Real OAuth Authentication -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
